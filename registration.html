<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Registration Page</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">

    <div class="container my-5">

        <div class="text-center mb-4">
            <h1>Event Registration Form</h1>
            <p class="text-muted">Register for the upcoming event</p>
        </div>


        <div class="card shadow p-4">

            <form>
                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" placeholder="Enter your name">
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" placeholder="Enter email" required>
                    </div>
                </div>

                <div class="row mb-3">

                    <div class="col-md-6">
                        <label class="form-label">Phone</label>
                        <input type="tel" class="form-control" placeholder="Enter phone number" required>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label">Select Event</label>
                        <select class="form-select" required>
                            <option>Choose Event</option>
                            <option>Web Development Workshop</option>
                            <option>Data Science Seminar</option>
                            <option>AI Conference</option>
                        </select>
                    </div>
                </div>
                <div class="container1 d-flex gap-3 mb-3">

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="eventPass" id="standardPass" value="standard"
                            >
                        <label class="form-check-label" for="standardPass">
                            Standard Pass
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="eventPass" id="premiumPass" value="premium"
                            >
                        <label class="form-check-label" for="premiumPass">
                            Premium Pass
                        </label>
                    </div>

                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="eventPass" id="platinumPass" value="platinum"
                            >
                        <label class="form-check-label" for="platinumPass">
                            Platinum Pass
                        </label>
                    </div>

                </div>


                <div class="form-check mb-3">
                    <input class="form-check-input" type="checkbox" value="" id="checkChecked" >
                    <label class="form-check-label" for="checkChecked">
                        Agree to terms
                    </label>
                </div>

                <div class="d-flex gap-3 mb-3">

                    <button class="btn btn-primary" type="submit" value="submit">Submit</button>
                    <button class="btn btn-primary" type="reset" value="reset">Reset</button>


                </div>

                <button type="submit" class="btn btn-primary w-100">Register Now</button>
            </form>

        </div>
    </div>


     <div class="container my-5 bg-white p-4 rounded shadow">
        <h2 class="mb-4">Registered Participants</h2>
        <div class="row g-4 mb-4">

            <div class="col-md-4 col-lg-3">
                <div class="card h-100">
                    <div class="card-body d-flex flex-column justify-content-center align-items-center text-center p-4 bg-light rounded shadow">
                        <h5 class="card-title">Santhosh</h5>
                        <p class="card-text">Email: santhosh@gmail.com</p>
                        <p class="card-text">Phone: 8688584444</p>
                        <p class="card-text">Event: Web Development Workshop</p>
                        <p class="card-text">Pass: Premium Pass</p>
                        
                    </div>

                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>
